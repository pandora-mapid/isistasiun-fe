# Stack frontend di server. Berdiri sendiri — bukan overlay dari compose lokal.
#
# Dijalankan langsung dari checkout git di VPS (~/isistasiun-fe), bukan lagi
# menarik image dari GHCR. `.env` di direktori ini milik server (dibuat sekali
# dari `.env.deploy.example`, di-gitignore) dan sekarang benar-benar dibaca
# saat build — lihat catatan build-args di service `frontend` di bawah.
#
#   docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env build frontend
#   docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env up -d frontend
#
# TLS dan routing ditangani reverse proxy bersama yang sudah ada di box
# (trackster-nginx-1 di network `shared-web-net`). Stack ini hanya memaparkan
# `frontend` ke network itu sebagai
#
#   ${COMPOSE_PROJECT_NAME}-frontend-1:3000
#
# jadi server block di nginx tinggal diarahkan ke upstream tersebut. Tidak ada
# port yang dipetakan ke host — satu-satunya jalan masuk adalah lewat proxy.

name: ${COMPOSE_PROJECT_NAME:-isistasiun-fe}

networks:
  shared-web-net:
    external: true

services:
  frontend:
    # Context `..` karena compose file ini ada di deploy/, Dockerfile di root
    # repo. Build jalan langsung di VPS dari checkout git, bukan pull image.
    build:
      context: ..
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_BASEMAP_URL: ${NEXT_PUBLIC_BASEMAP_URL}

    restart: always

    # NEXT_PUBLIC_* sekarang beneran dibaca dari `.env` di VPS ini — lewat
    # build args di atas, karena Next.js menyisipkannya saat build, bukan saat
    # container jalan. Ubah nilainya di sini lalu deploy ulang; tidak perlu
    # lagi menyentuh GitHub Actions variables.
    env_file: .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server standalone harus mendengar di semua interface agar bisa
      # dijangkau nginx dari container lain.
      HOSTNAME: "0.0.0.0"

    # `expose`, bukan `ports`: hanya terlihat dari sesama container di
    # shared-web-net, tidak dari internet lewat IP host.
    expose:
      - "3000"

    networks:
      - shared-web-net

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
